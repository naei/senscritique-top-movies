<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Movie Rankings by Date</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        #breadcrumb {
            padding: 10px;
            background-color: #f5f5f5;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-align: left;
            font-size: 0.8em;
        }

        #breadcrumb div {
            margin: 0;
            width: fit-content;
        }

        #breadcrumb a {
            text-decoration: none;
            color: #0275d8;
            font-weight: bold;
        }

        #breadcrumb span {
            color: #666;
        }

        .date-input-container {
            margin-bottom: 20px;
        }

        .date-input {
            width: 200px;
            padding: 10px;
            margin-right: 10px;
        }

        #rankingChart {
            width: 100%;
            max-width: 800px;
            height: 400px;
            margin-top: 50px;
        }
    </style>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/pikaday/css/pikaday.css">
    <script src="https://cdn.jsdelivr.net/npm/moment"></script>
    <script src="https://cdn.jsdelivr.net/npm/pikaday/pikaday.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <header>
        <nav id="breadcrumb">
            <div><a href="./">Homepage</a> > <span>By Date</span></div>
        </nav>
    </header>

    <input type="text" id="dateInput1" class="date-input" placeholder="Select first date...">
    <input type="text" id="dateInput2" class="date-input" placeholder="Select second date...">
    <br />
    <canvas id="rankingChart" width="800" height="400"></canvas>

    <script src="bydate.js"></script>
</body>

</html>
