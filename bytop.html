<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Top Movies</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        #breadcrumb {
            padding: 10px;
            background-color: #f5f5f5;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-align: left;
            font-size: 0.8em;
        }

        #breadcrumb div {
            margin: 0;
            width: fit-content;
        }

        #breadcrumb a {
            text-decoration: none;
            color: #0275d8;
            font-weight: bold;
        }

        #breadcrumb span {
            color: #666;
        }

        #aggregate-chart-container {
            margin-bottom: 30px;
        }

        #aggregate-chart {
            width: 100%;
            height: auto;
        }

        hr {
            margin-top: 50px;
            margin-bottom: 100px;
        }

        .movie {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }

        .movie-info {
            margin-right: 20px;
            text-align: center;
            width: 200px;
        }

        .movie-picture {
            width: 150px;
            height: auto;
        }

        .movie-title {
            display: block;
            font-size: 1.2em;
            margin-top: 10px;
        }

        .chart-container {
            width: 800px;
        }

        .movie-chart {
            width: 100%;
            height: 100%;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <header>
        <nav id="breadcrumb">
            <div><a href="./">Homepage</a> > <span>Top Movies</span></div>
        </nav>
    </header>

    <div id="aggregate-chart-container">
        <canvas id="aggregate-chart"></canvas>
    </div>

    <hr>

    <div id="movies-container"></div>
    <script src="bytop.js"></script>
</body>

</html>
