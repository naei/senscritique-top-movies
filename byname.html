<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Movie Ranking Evolution</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        #breadcrumb {
            padding: 10px;
            background-color: #f5f5f5;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-align: left;
            font-size: 0.8em;
        }

        #breadcrumb div {
            margin: 0;
            width: fit-content;
        }

        #breadcrumb a {
            text-decoration: none;
            color: #0275d8;
            font-weight: bold;
        }

        #breadcrumb span {
            color: #666;
        }

        #searchBar {
            width: 300px;
            padding: 10px;
            margin-bottom: 20px;
        }

        .search-result-item {
            padding: 5px;
            border: 1px solid #ddd;
            margin-top: 2px;
            cursor: pointer;
        }

        .search-result-item:hover {
            background-color: #f0f0f0;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>

<body>
    <header>
        <nav id="breadcrumb">
            <div><a href="./">Homepage</a> > <span>By Name</span></div>
        </nav>
    </header>

    <input type="text" id="searchBar" placeholder="Search for a movie...">
    <div id="searchResults"></div>
    <canvas id="rankingChart" width="800" height="400"></canvas>

    <script src="byname.js"></script>
</body>

</html>
